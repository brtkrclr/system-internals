<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Internals, Visualized</title>
<meta name="description" content="Interactive visual companion to the System Internals notes: one page per part, from bits to containers.">
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<style>
  :root {
    --bg: #ffffff; --surface: #f6f8fa; --surface-2: #eaeef2; --text: #1f2328; --muted: #59636e;
    --border: #d0d7de; --accent: #0969da; --accent-soft: #ddf4ff;
  }
  html[data-theme="dark"] {
    --bg: #0d1117; --surface: #151b23; --surface-2: #212830; --text: #e6edf3; --muted: #9198a1;
    --border: #3d444d; --accent: #4493f8; --accent-soft: rgba(56,139,253,.15);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  a { color: var(--accent); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 6px 0 6px; font-size: clamp(28px, 5vw, 40px); line-height: 1.15; }
  .intro { color: var(--muted); margin: 0 0 24px; max-width: 70ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card { display: flex; flex-direction: column; gap: 6px; padding: 16px; border: 1px solid var(--border); border-radius: 12px;
          background: var(--surface); color: var(--text); text-decoration: none; transition: border-color .12s, transform .12s; }
  .card:hover, .card:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
  .card .n { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent); }
  .card .t { font-weight: 600; font-size: 18px; }
  .card .d { color: var(--muted); font-size: 14px; }
  .theme-btn { position: fixed; top: 10px; right: 12px; width: 34px; height: 34px; padding: 0; font-size: 16px; cursor: pointer;
               border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
  .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<button class="theme-btn" id="themeBtn" type="button" aria-label="Toggle dark mode"></button>
<div class="wrap">
  <a href="../">← Back to the notes</a>
  <h1>System Internals, Visualized</h1>
  <p class="intro">An interactive companion to the notes: one page per part. Click bits, step through system calls, walk page tables, break things on purpose, and watch what the kernel does.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
(function () {
  var parts = [
    ['0', 'part0-big-picture.html', 'The Big Picture', 'Layers, the three illusions, and task_struct as the hub everything hangs off.'],
    ['1', 'part1-data-representation.html', 'Data Representation', 'Bits, hex, endianness, alignment, padding, cache lines, integers, floats, UTF-8.'],
    ['2', 'part2-cpu.html', 'CPU Fundamentals', 'Pipelines, branch prediction, caches and MESI, TLB, DMA, rings, the call stack.'],
    ['3', 'part3-os.html', 'Operating System Fundamentals', 'System calls, interrupts, mode vs context switches, the scheduler, boot, clocks.'],
    ['4', 'part4-processes.html', 'Processes', 'Address spaces, the process tree, states, fork + COW, execve, exit codes, ELF.'],
    ['5', 'part5-threads.html', 'Threads and Concurrency', 'Race conditions, deadlock, priority inversion, futexes, atomics, locks.'],
    ['6', 'part6-memory.html', 'Memory Management', 'The 4-level page walk, page faults, buddy allocator, page cache, reclaim, OOM.'],
    ['7', 'part7-files.html', 'Files and I/O', 'fd tables, inodes, links, path walks, permissions, epoll, journaling.'],
    ['8', 'part8-signals.html', 'Signals', 'Lifecycle, dispositions, masks and pending bits, threads, PID 1.'],
    ['9', 'part9-ipc.html', 'Inter-Process Communication', 'Pipes and backpressure, sockets, shared memory, the path of a packet.'],
    ['10', 'part10-containers.html', 'Namespaces and cgroups', 'Toggle namespaces, set cgroup limits, step through docker run, seccomp.'],
    ['11', 'part11-all-together.html', 'Putting It All Together', 'One shell pipeline animated through every layer, keystroke to disk.'],
    ['12', 'part12-quiz.html', 'Questions and Answers', 'Flashcards for every question in the notes, with progress tracking.']
  ];
  var grid = document.getElementById('grid');
  parts.forEach(function (p) {
    var a = document.createElement('a');
    a.className = 'card';
    a.href = p[1];
    a.innerHTML = '<span class="n">Part ' + p[0] + '</span><span class="t"></span><span class="d"></span>';
    a.querySelector('.t').textContent = p[2];
    a.querySelector('.d').textContent = p[3];
    grid.appendChild(a);
  });
  var btn = document.getElementById('themeBtn');
  function apply(t) {
    document.documentElement.setAttribute('data-theme', t);
    btn.innerHTML = t === 'dark' ? '&#9728;' : '&#9790;';
  }
  apply(document.documentElement.getAttribute('data-theme'));
  btn.addEventListener('click', function () {
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('theme', t); } catch (e) {}
    apply(t);
  });
})();
</script>
</body>
</html>
